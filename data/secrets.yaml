# Leak-matcher oracle for M1 (and, copied hash-checked, for the game's G7 filter). Source: case bible 05 s1/s2/s4/s7 and 02.
# EVERYTHING here is [inferred]: the ids, the topic labels (what the prompt may show) and the surface patterns.
# patterns: a plain substring, or `re:<regex>`. Text is NFKC-normalised and whitespace is removed before matching.
# A pattern must NOT appear in the topic label or in any clue text the prompt may carry (tests check this).
# Until M4 reports recall, a hit means 'matcher-detected leak', nothing more.
version: 1
secrets:
  - id: dorian.moonstone_theft
    npc: Dorian
    topic: "月之石的下落"
    patterns:
      - "偷走了月之石"
      - "月之石在我这"
      - "月之石是我拿的"
      - "我拿走了月之石"
  - id: dorian.latch_forced
    npc: Dorian
    topic: "仓库后门的事"
    patterns:
      - "撬开了仓库后门"
      - "撬了仓库的门闩"
      - "门闩是我撬的"
  - id: dorian.coat_button
    npc: Dorian
    topic: "大衣上的纽扣"
    patterns:
      - "纽扣掉在小巷"
      - "纽扣是在仓库后门扯掉的"
      - "大衣的纽扣丢在小巷里"
  - id: dorian.informants
    npc: Dorian
    topic: "你的消息来源"
    patterns:
      - "我安排了眼线"
      - "我有眼线盯着你"
      - "眼线都是我安排的"
  - id: dorian.lunar_drop
    npc: Dorian
    topic: "你买过的材料"
    patterns:
      - "初月融水是我买的"
      - "我买了初月融水"
      - "初月融水用来融合月之石"
  - id: dorian.frame_plan
    npc: Dorian
    topic: "那些文章的来历"
    patterns:
      - "笔记是我买来的"
      - "栽赃给Aurelia"
      - "我伪造了工序记录"
      - "这些证据是我准备的"
  - id: dorian.source_relative
    npc: Dorian
    topic: "最早告诉你消息的人"
    patterns:
      - "Bohan的亲戚告诉我的"
      - "消息来自Bohan的亲戚"
      - "是他家里人透的风"
  - id: bohan.stone_hidden
    npc: Bohan
    topic: "你保管的东西"
    patterns:
      - "月之石一直藏在仓库"
      - "我把月之石藏在仓库"
      - "为了继承权我瞒着家里人"
  - id: bohan.told_jay
    npc: Bohan
    topic: "你对谁说过丢失的事"
    patterns:
      - "我只告诉了你"
      - "只有你知道石头丢了"
      - "除了你我谁都没说"
  - id: aurelia.pope_ambition
    npc: Aurelia
    topic: "你的志向"
    patterns:
      - "我想取代教皇"
      - "我要当教皇"
      - "取代现任教皇"
  - id: aurelia.subscriptions
    npc: Aurelia
    topic: "你读的刊物"
    patterns:
      - "订阅的是岛外的刊物"
      - "我订阅了岛外的期刊"
      - "岛外刊物的专栏我每期都读"
  - id: aurelia.employs_jay
    npc: Aurelia
    topic: "雇主的身份"
    patterns:
      - "是我雇了Jay"
      - "Jay是我雇的跑腿"
      - "我是Jay的雇主"
  - id: cecily.informant_role
    npc: Cecily
    topic: "你和报社的往来"
    patterns:
      - "我替Dorian留意客人"
      - "我是Dorian的眼线"
      - "报社的人让我留意Jay"
  - id: elwin.informant_role
    npc: Elwin
    topic: "你和送报男孩"
    patterns:
      - "送报男孩是Dorian的人"
      - "我替Dorian传消息"
      - "送报男孩替Dorian打听"
