model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"

paths:
  data_file:  "/home/seabass1/datasets/rpg-npc-llm/npc_dialogues.jsonl"
  data_cache: "/home/seabass1/datasets/rpg-npc-llm/npc_dialogues_tok"
  output_dir: "/home/seabass1/checkpoints/qwen-npc-lora-v1"
  log_dir:    "/home/seabass1/logs/qwen-npc-lora-v1"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 2
  learning_rate: 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 1024
  bf16: true
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  logging_steps: 20
  report_to: "none"

seed: 42
date: "2026-04-26"
notes: "Initial LoRA SFT run — Qwen2.5-7B on NPC dialogue dataset."
